<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – Freewill</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="navbar">
    <a class="brand" href="/">Freewill</a>
    <nav>
      <a href="/products.html">Shop</a>
      <a href="/cart.html">Cart (<span id="cart-count">0</span>)</a>
      <span id="nav-auth">
        <a href="/login.html">Login</a>
        <a href="/register.html">Register</a>
      </span>
      <button id="logout-btn" style="display:none" class="btn btn-sm">Logout</button>
    </nav>
  </header>

  <main class="section">
    <h1 class="section-title">All Products</h1>

    <!-- Filters -->
    <div class="filters">
      <input id="filter-category" type="text" placeholder="Category…" class="input" />
      <input id="filter-min" type="number" placeholder="Min price" class="input" min="0" step="0.01" />
      <input id="filter-max" type="number" placeholder="Max price" class="input" min="0" step="0.01" />
      <button id="filter-btn" class="btn btn-primary">Filter</button>
    </div>

    <div class="product-grid" id="product-grid">
      <p class="loading">Loading products…</p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Freewill. All rights reserved.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
