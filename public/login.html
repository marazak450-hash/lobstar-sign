<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Freewill</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="navbar">
    <a class="brand" href="/">Freewill</a>
    <nav>
      <a href="/products.html">Shop</a>
    </nav>
  </header>

  <main class="section form-page">
    <h1 class="section-title">Login</h1>
    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input" required autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="input" required autocomplete="current-password" />

      <p id="login-error" class="error" style="display:none"></p>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="form-footer">Don't have an account? <a href="/register.html">Register</a></p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Freewill. All rights reserved.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
