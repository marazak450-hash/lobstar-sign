<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Freewill</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="pattern-border"></div>

  <header class="navbar">
    <a class="brand" href="/">
      <span class="brand-name">Freewill</span>
      <span class="brand-tagline">Atlas Mountain Yarn · Morocco</span>
    </a>
    <nav>
      <a href="/products.html">Shop</a>
    </nav>
  </header>

  <div class="form-page-wrap">
    <div class="form-card">
      <div class="form-card-header">
        <div class="form-icon">🌿</div>
        <h1>Join the Circle</h1>
        <p>Create your Freewill account and start shopping</p>
      </div>
      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" class="input" required autocomplete="name" placeholder="Your name" maxlength="100" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" class="input" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" class="input" required autocomplete="new-password" placeholder="Choose a password" />
          <span class="hint">Min 8 chars · 1 uppercase · 1 number · 1 special character</span>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" class="input" required autocomplete="new-password" placeholder="Repeat password" />
        </div>
        <p id="register-error" class="error" style="display:none"></p>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem">Create Account</button>
      </form>
      <p class="form-footer" style="margin-top:1.25rem">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
