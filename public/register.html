<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – Freewill</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="navbar">
    <a class="brand" href="/">Freewill</a>
    <nav>
      <a href="/products.html">Shop</a>
    </nav>
  </header>

  <main class="section form-page">
    <h1 class="section-title">Create Account</h1>
    <form id="register-form" novalidate>
      <label for="name">Full Name</label>
      <input id="name" name="name" type="text" class="input" required autocomplete="name" maxlength="100" />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" class="input" required autocomplete="email" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" class="input" required autocomplete="new-password" />
      <small class="hint">Min 8 chars, 1 uppercase, 1 number, 1 special character.</small>

      <label for="confirm">Confirm Password</label>
      <input id="confirm" name="confirm" type="password" class="input" required autocomplete="new-password" />

      <p id="register-error" class="error" style="display:none"></p>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <p class="form-footer">Already have an account? <a href="/login.html">Login</a></p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Freewill. All rights reserved.</p>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
